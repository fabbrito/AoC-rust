# This repo's whole hook policy. The engine beside it is vendored from
# fabbrito/githooks v0.3.1 — bump it by copying a newer tag, edit this.
# The version is named here and nowhere else, so a bump is one file.
schema = 1

types       = feat fix refactor chore style docs test build perf
subject_max = 72
bullet_max  = 2
body_cols   = 80

# One scope per year crate off the glob; the shared lib and the loose
# repo-level files get fixed names.
scope_fixed = repo aoc templates scripts hooks
scope_root  = 202*/

# No trailers: both lists are empty, so every trailer is an unknown one and is
# rejected - the old hand-written commit-msg hook's policy. A topic that does
# not fit in two bullets belongs in a comment in the code.
trailer_person    =
trailer_reference =

# require = true everywhere: a lane that skipped itself is not a green commit.
# Clippy and the test suite stay in `make lint` / `make test` — neither is
# fast enough to sit between you and a commit.

# Whole tree, not the staged paths: cargo cannot compile a half-staged file,
# and a formatted crate can still fail to build against an unformatted one.
# clippy.toml is here because it redefines every lint in the tree.
[group rust]
match   = *.rs Cargo.toml */Cargo.toml Cargo.lock clippy.toml
scope   = tree
require = true
run     = cargo fmt --all --check
fix     = cargo fmt --all
run     = cargo check --workspace --all-targets --all-features

# .githooks/githooks is left out of match — upstream's formatting is not ours
# to grade, and a style bump upstream would go red on an old vendored copy.
[group shell]
match   = *.sh .githooks/commit-msg .githooks/pre-commit
scope   = staged
require = true
run     = shfmt -i 0 -ci -d
fix     = shfmt -i 0 -ci -w
run     = shellcheck -x -P scripts

# dprint owns markdown only here (dprint.json includes **/*.md).
# --allow-no-files: dprint exits nonzero when every path it is handed is one of
# its own excludes, which a commit touching only excluded markdown would be.
[group format]
match   = *.md
scope   = staged
require = true
run     = dprint check --allow-no-files
fix     = dprint fmt --allow-no-files

# Changing dprint.json redefines "formatted" for the whole tree, so it is the
# one change that has to pay for the whole tree.
[group dprint-config]
match   = dprint.json
scope   = tree
require = true
run     = dprint check
fix     = dprint fmt
