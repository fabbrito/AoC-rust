# This repo's own tools; the gate's are repokit's copies in .config/mise/conf.d/.
# Pinned: a tool that drifts turns a green tree red with no edit. A bump is a
# version here and `make deps`.
min_version = "2026.9"

[settings]
# A release is taken a day after it ships. make upgrade holds back what this
# would refuse; dprint and cargo are told the same day in their own places.
minimum_release_age = "1d"

[tools]
# rust: rustup's, on the default stable toolchain - not mise's.
