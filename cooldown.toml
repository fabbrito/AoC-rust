# cargo's cooldown until -Z min-publish-age lands on stable: a release must be
# a day old before it enters Cargo.lock. cargo-cooldown wraps cargo and cools
# what it resolved; make upgrade runs cargo through it.
[cooldown]
# A version Cargo.toml demands and cooldown refuses fails the run: that bump is
# a decision, not a default.
incompatible-publish-age = "deny"
lockfile-baseline = "floor"

[registry]
global-min-publish-age = "1 day"
